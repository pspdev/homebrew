<head>
  <title>PSP Homebrew Database</title>
  <link rel="stylesheet" href="style.css">
  <script src="homebrew.js" defer></script>
</head>
<body>
  <nav>
    <a id="title" href="">PSP <span>Homebrew</span> Database</a>
  </nav>
  <div id="filters">
    <div>
      Category:
      <select id="category_select" oninput="applyFilters()">
        <option value="">All</option>
      </select>
    </div>
    <div>
      Search:
      <input id="search" oninput="applyFilters()">
    </div>
    <div>
      Tag:
      <select id="tag_select" oninput="applyFilters()">
        <option value="">--</option>
      </select>
    </div>
  </div>
  <div id="homebrew_list"></div>
  <div id="pagination"></div>
</body>
